name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependencies
        run: python -m pip install -r requirements.txt
      - name: Check source syntax
        run: npm run check
      - name: Test JavaScript (mock Codex only)
        run: npm test
      - name: Test PDF parser
        run: npm run test:python
      - name: Audit publishable source
        run: npm run release:check
      - name: Validate source package
        run: npm run release:pack
